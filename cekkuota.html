<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADIJAYA VPN — Cek Kuota XL & Axis</title>
  <meta name="description" content="Cek kuota & masa aktif XL/Axis — ADIJAYA VPN." />
  <link rel="icon" href="logo-adijaya.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6fbf8; --card:#ffffff; --line:#e8efe9; --shadow:0 10px 25px rgba(17,122,60,.08);
      --brand:#14a44d; --brand-600:#128c42; --brand-100:#e9f9ef; --text:#0c1a12; --muted:#5b6b61;
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter, system-ui,-apple-system, Segoe UI, Roboto, Helvetica, Arial}
    a{color:inherit;text-decoration:none}
    .container{max-width:900px;margin:0 auto;padding:0 16px}

    /* Topbar konsisten */
    .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#ffffff,#f7fdf9);border-bottom:1px solid var(--line)}
    .topbar-inner{height:56px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;box-shadow:var(--shadow);border:1px solid var(--line)}
    .brand small{font-weight:700;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:#fff}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:var(--brand-600)}

    /* Card/form */
    .section{padding:18px 0 28px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--brand-100);color:var(--brand-600);border:1px solid #d6f3e0;font-weight:700;font-size:12px}
    .input{width:100%;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);outline:none}
    textarea{width:100%;border-radius:12px;border:1px solid var(--line);padding:10px;min-height:140px}
    .hint{color:var(--muted);font-size:13px}
    .row{display:grid;grid-template-columns:1fr auto;gap:10px}

    /* Footer mini */
    footer{padding:18px 0;border-top:1px solid var(--line);color:#4c5a52;text-align:center}
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <img src="logo-adijaya.png" alt="ADIJAYA VPN" />
        <div>ADIJAYA VPN<br><small>Cek Kuota XL & Axis</small></div>
      </a>
      <div style="display:flex;gap:10px">
        <a class="btn" href="index.html">Dashboard</a>
        <a class="btn primary" href="cekkuota.html">Cek Kuota</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="card">
        <div class="pill">XL/AXIS — Pengecekan Nomor</div>
        <h2 style="margin:10px 0 4px">Cek Kuota & Masa Aktif</h2>
        <p class="hint">Masukkan nomor XL/Axis Anda. Boleh format 08xxxxxxxxxx, +62xxxxxxxxxx, atau 62xxxxxxxxxx.</p>

        <div class="row" style="margin-top:10px">
          <input class="input" id="msisdn_input" placeholder="Contoh: 0878xxxxxxx atau +62878xxxxxxx" />
          <button class="btn primary" id="btnCheck">Cek Nomor</button>
        </div>

        <div id="loading" style="display:none;margin-top:12px" class="hint">Memeriksa...</div>

        <div id="resultBox" style="display:none;margin-top:12px">
          <label for="result_xl" class="hint" style="display:block;margin-bottom:6px">Hasil</label>
          <textarea id="result_xl" readonly style="font-size:13px"></textarea>
          <div style="display:flex;gap:10px;margin-top:10px">
            <button class="btn" id="btnCopy">Salin Hasil</button>
            <a class="btn" href="index.html">Kembali</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">© <span id="y"></span> ADIJAYA VPN</div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    function normalizeMsisdn(v){
      v = (v||'').trim();
      if(v.startsWith('+62')) return '0'+ v.substring(3);
      if(v.startsWith('62')) return '0'+ v.substring(2);
      return v;
    }

    const btnCheck = document.getElementById('btnCheck');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('resultBox');
    const resultTextarea = document.getElementById('result_xl');

    btnCheck.addEventListener('click', async ()=>{
      let msisdn = normalizeMsisdn(document.getElementById('msisdn_input').value);
      if(!msisdn){ alert('Nomor wajib diisi'); return; }
      loading.style.display='block';
      resultBox.style.display='none';
      resultTextarea.value='';
      try{
        const resp = await fetch(`https://web.garaaa.biz.id/cekxl?msisdn=${msisdn}`);
        if(!resp.ok) throw new Error('Jaringan tidak merespon, kode: '+resp.status);
        const data = await resp.json();
        loading.style.display='none';
        resultBox.style.display='block';
        if(data.success){
          resultTextarea.value = data.data;
        }else{
          resultTextarea.value = 'Error: ' + (data.message || 'Terjadi kesalahan saat mengambil data.');
        }
      }catch(err){
        loading.style.display='none';
        resultBox.style.display='block';
        resultTextarea.value = 'Terjadi kesalahan: ' + err.message;
      }
    });

    document.getElementById('btnCopy').addEventListener('click', ()=>{
      resultTextarea.select();
      resultTextarea.setSelectionRange(0,99999);
      navigator.clipboard.writeText(resultTextarea.value)
        .then(()=>alert('Hasil telah disalin ke clipboard!'))
        .catch(()=>alert('Gagal menyalin hasil.'))
    });
  </script>
</body>
</html>
